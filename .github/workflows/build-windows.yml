name: Build Windows EXE (Tauri)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-tauri-${{ hashFiles('src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tauri-

      - name: Install Tauri CLI globally
        run: npm install -g @tauri-apps/cli@^1.6.3

      - name: Stage web assets into www/
        shell: bash
        run: |
          mkdir -p www
          # PowerShell-friendly copy using rsync (available in git-bash on windows runners)
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='android' \
            --exclude='src-tauri' \
            --exclude='supabase' \
            --exclude='scripts' \
            --exclude='www' \
            --exclude='_site' \
            --exclude='*.md' \
            --exclude='package*.json' \
            --exclude='capacitor.config.json' \
            --exclude='.gitignore' \
            ./ www/
          ls www/

      - name: Generate Tauri icons from assets/icon-512.png
        run: tauri icon assets/icon-512.png

      - name: Build Tauri app
        run: tauri build

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p artifacts
          # NSIS installer (.exe)
          cp src-tauri/target/release/bundle/nsis/*.exe artifacts/ 2>/dev/null || true
          # MSI installer
          cp src-tauri/target/release/bundle/msi/*.msi artifacts/ 2>/dev/null || true
          ls -la artifacts/

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: abd-saif-windows
          path: artifacts/*
          retention-days: 30
          if-no-files-found: error

      - name: Publish Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
