name: Build Windows EXE (Tauri)

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      # Tauri needs platform-specific icons. Generate them from the existing PNG.
      - name: Generate Tauri icons from assets/icon-512.png
        run: npx @tauri-apps/cli icon assets/icon-512.png --output src-tauri/icons

      - name: Build Tauri app (MSI + NSIS installers)
        run: npx @tauri-apps/cli build

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/msi/*.msi artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/nsis/*.exe artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/*.exe artifacts/abd-saif.exe 2>/dev/null || true
          ls -la artifacts/

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: abd-saif-windows
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
