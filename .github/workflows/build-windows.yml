name: Build Windows EXE (Tauri)
on:
  push: { branches: [main], tags: ['v*'] }
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.toml') }}
      - run: npm install --no-audit --no-fund
      - run: npx @tauri-apps/cli icon assets/icon-512.png --output src-tauri/icons
      - run: npx @tauri-apps/cli build
      - shell: bash
        run: |
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/msi/*.msi artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/nsis/*.exe artifacts/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with: { name: abd-saif-windows, path: artifacts/*, retention-days: 30 }
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: 'artifacts/*', generate_release_notes: true }
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
