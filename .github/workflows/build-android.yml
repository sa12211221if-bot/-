name: Build Android APK
on:
  push: { branches: [main], tags: ['v*'] }
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: android-actions/setup-android@v3
      - run: npm install --no-audit --no-fund
      - run: npx cap add android 2>/dev/null || true
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --no-daemon
      - run: mkdir -p artifacts && cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/abd-saif.apk
      - uses: actions/upload-artifact@v4
        with: { name: abd-saif-apk, path: artifacts/abd-saif.apk, retention-days: 30 }
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: artifacts/abd-saif.apk, generate_release_notes: true }
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
