name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Capacitor needs a package.json with deps installed before `cap add android`.
      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      # Generate the native Android project from the web app at the repo root.
      # Capacitor reads `webDir: .` from capacitor.config.json.
      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x ./android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             artifacts/abd-saif-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: abd-saif-android-apk
          path: artifacts/abd-saif-debug.apk
          if-no-files-found: error
          retention-days: 30

      # When pushing a tag (e.g. v1.0.0) also publish a GitHub Release with the APK attached.
      - name: Publish Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/abd-saif-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
