[package]
name = "abd-saif"
version = "1.0.0"
description = "عبد سيف — نظام شخصي متكامل لإدارة العمل الإبداعي"
authors = ["abdsaif"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = ["shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
