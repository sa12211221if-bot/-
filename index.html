<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0f" />
  <meta name="description" content="Designer OS — Personal management system for freelance designers" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg" />
  <link rel="apple-touch-icon" href="./assets/icon-512.png" />
  <link rel="stylesheet" href="./css/styles.css" />
  <title>Designer OS</title>
</head>
<body>
  <div id="app">
    <div class="boot-screen">
      <div class="boot-logo">
        <div class="boot-glow"></div>
        <span>D</span>
      </div>
      <p class="boot-text">Loading Designer OS…</p>
    </div>
  </div>

  <!-- Quick capture modal mount point -->
  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script type="module" src="./js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
