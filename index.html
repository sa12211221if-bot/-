<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="عبد سيف" />
  <meta name="description" content="عبد سيف — نظامك الشخصي لإدارة العمل الإبداعي" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icon-192.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="./assets/icon-512.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="./assets/icon-192.png" />
  <link rel="stylesheet" href="./css/styles.css" />
  <title>عبد سيف</title>
</head>
<body>
  <div id="app">
    <div class="boot-screen">
      <div class="boot-logo">
        <div class="boot-glow"></div>
        <span>ع</span>
      </div>
      <p class="boot-text">جاري تحميل عبد سيف…</p>
    </div>
  </div>

  <!-- Quick capture modal mount point -->
  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <!-- Install banner (shown when PWA is installable) -->
  <div id="install-banner" style="display:none; position:fixed; bottom:90px; inset-inline-start:50%; transform:translateX(-50%); z-index:100; background:linear-gradient(135deg,rgba(255,107,53,0.95),rgba(255,87,34,0.95)); color:white; padding:14px 22px; border-radius:16px; box-shadow:0 16px 40px rgba(255,107,53,0.4); font-size:14px; font-weight:600; display:flex; align-items:center; gap:12px; max-width:90vw; cursor:pointer; font-family:inherit; animation:toastIn 300ms ease;">
    <span style="font-size:22px;">📲</span>
    <span id="install-text">ثبّت عبد سيف على جهازك</span>
    <button id="install-btn" style="background:white; color:#FF5722; border:none; padding:8px 16px; border-radius:10px; font-weight:700; cursor:pointer; font-size:13px; font-family:inherit;">تثبيت</button>
    <button id="install-dismiss" style="background:transparent; border:none; color:white; opacity:0.7; font-size:18px; cursor:pointer; padding:4px;">✕</button>
  </div>

  <script type="module" src="./js/app.js"></script>
  <script>
    // Service Worker registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then((reg) => {
            console.log('SW registered:', reg.scope);
            // Check for updates periodically
            setInterval(() => reg.update(), 60 * 60 * 1000);
          })
          .catch((err) => console.log('SW failed:', err));
      });
    }

    // PWA Install prompt
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const banner = document.getElementById('install-banner');
      if (banner) banner.style.display = 'flex';
    });

    document.addEventListener('click', (e) => {
      if (e.target.id === 'install-btn' || e.target.closest('#install-banner') && !e.target.closest('#install-dismiss')) {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then((choice) => {
            if (choice.outcome === 'accepted') {
              document.getElementById('install-banner').style.display = 'none';
            }
            deferredPrompt = null;
          });
        }
      }
      if (e.target.id === 'install-dismiss' || e.target.closest('#install-dismiss')) {
        document.getElementById('install-banner').style.display = 'none';
      }
    });

    // Hide banner if already installed
    window.addEventListener('appinstalled', () => {
      const banner = document.getElementById('install-banner');
      if (banner) banner.style.display = 'none';
      deferredPrompt = null;
    });

    // Detect standalone mode (already installed)
    if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) {
      const banner = document.getElementById('install-banner');
      if (banner) banner.style.display = 'none';
    }
  </script>
</body>
</html>
