<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0d12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="عبد سيف" />
  <meta name="description" content="عبد سيف — نظامك الشخصي لإدارة العمل الإبداعي" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="./assets/icon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icon-192.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="./assets/icon-512.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="./assets/icon-192.png" />
  <link rel="stylesheet" href="./css/styles.css" />
  <title>عبد سيف</title>
</head>
<body>
  <div id="app">
    <div class="boot-screen">
      <div class="boot-logo">
        <div class="boot-glow"></div>
        <span>ع</span>
      </div>
      <p class="boot-text">جاري تحميل عبد سيف…</p>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script type="module" src="./js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then((reg) => { setInterval(() => reg.update(), 60 * 60 * 1000); })
          .catch(() => {});
      });
    }
    // Install prompt suppressed — cleaner UI per user request.
    window.addEventListener('beforeinstallprompt', (e) => e.preventDefault());
  </script>
</body>
</html>
